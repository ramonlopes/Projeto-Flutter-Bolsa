name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bolsa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolsa_db
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api_node/package-lock.json
      - name: Instalar dependências
        working-directory: api_node
        run: npm install
      - name: Lint
        working-directory: api_node
        run: npm run lint || echo "Sem lint"
      - name: Test
        working-directory: api_node
        run: npm test
      - name: Smoke start
        working-directory: api_node
        run: |
          node src/server.js &
          sleep 5
          curl -f http://localhost:3000/healthz
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Pub get
        working-directory: app_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: app_flutter
        run: flutter analyze
      - name: Test
        working-directory: app_flutter
        run: flutter test || echo "Sem testes"
      - name: Build Web
        working-directory: app_flutter
        run: flutter build web --release
      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: app_flutter/build/web